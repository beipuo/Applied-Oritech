plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()

    // CurseMaven — Oritech, AE2, GuideME.
    // Restricted to the curse.maven group so it isn't queried for anything else.
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }

    // Architectury API — hard dependency of Oritech (BOTH sides)
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
    }

    // GeckoLib — hard dependency of Oritech (BOTH sides)
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }

    // Athena (CTM) — hard dependency of Oritech (CLIENT side)
    maven {
        name = 'TeamResourceful'
        url = 'https://maven.teamresourceful.com/repository/maven-public/'
    }

    // ModMaven — mirrors GrandPower, GuideME and friends
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Opt-in integration tests run against real Oritech and AE2 block entities.
if (providers.gradleProperty('aoGameTests').isPresent()) {
    sourceSets.main.java.srcDir 'src/gametest/java'
    def testStructures = tasks.register('generateGameTestStructure') {
        def output = layout.buildDirectory.file('generated/gametest/data/applied_oritech/structure/empty.nbt')
        outputs.file(output)
        doLast {
            def target = output.get().asFile
            target.parentFile.mkdirs()
            new DataOutputStream(new java.util.zip.GZIPOutputStream(new FileOutputStream(target))).withCloseable { out ->
                out.writeByte(10); out.writeUTF('')
                out.writeByte(3); out.writeUTF('DataVersion'); out.writeInt(3955)
                out.writeByte(9); out.writeUTF('size'); out.writeByte(3); out.writeInt(3)
                [7, 5, 7].each { out.writeInt(it) }
                out.writeByte(9); out.writeUTF('palette'); out.writeByte(10); out.writeInt(1)
                out.writeByte(8); out.writeUTF('Name'); out.writeUTF('minecraft:air'); out.writeByte(0)
                ['blocks', 'entities'].each {
                    out.writeByte(9); out.writeUTF(it); out.writeByte(10); out.writeInt(0)
                }
                out.writeByte(0)
            }
        }
    }
    sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/gametest'))
    tasks.named('processResources').configure { dependsOn(testStructures) }
}


// Development-only dependencies, excluded from published runtime dependencies.
configurations {
    localRuntime {
        canBeResolved = false
        canBeConsumed = false
    }
    runtimeClasspath.extendsFrom(localRuntime)
}

dependencies {
    // ---- The two mods we bridge -------------------------------------------------
    // Oritech (oritech-neoforge-1.21.1-1.2.12). The NeoForge jar bundles the whole
    // `common` module, so all rearth.oritech.* classes are on the compile classpath.
    implementation "curse.maven:oritech-1030830:${oritech_file_id}"
    // Applied Energistics 2 19.2.17
    implementation "curse.maven:applied-energistics-2-223794:${ae2_file_id}"
    // Optional integration, also loaded in local development runs.
    compileOnly "curse.maven:ex-pattern-provider-892005:8811572"
    localRuntime "curse.maven:ex-pattern-provider-892005:8811572"
    // CurseMaven does not resolve ExtendedAE's required Glodium dependency.
    localRuntime "io.github.glodblock:Glodium:1.21-2.2-neoforge"
    compileOnly "curse.maven:applied-mekanistics-574300:7096962"
    localRuntime "curse.maven:applied-mekanistics-574300:7096962"
    compileOnly "curse.maven:mekanism-268560:7904058"
    localRuntime "curse.maven:mekanism-268560:7904058"

    // ---- Transitive runtime deps -----------------------------------------------
    // CurseMaven artifacts ship no POM, so nothing resolves transitively. Every hard
    // dependency of Oritech and AE2 has to be named here by hand.

    // Required by AE2
    implementation "curse.maven:guideme-1173950:${guideme_file_id}"

    // Required by Oritech. Architectury and GeckoLib are on the compile classpath
    // too: Oritech's own block entities implement their interfaces (for example
    // AddonBlockEntity subclasses use architectury's ExtendedMenuProvider), so we
    // need them resolvable when we extend those classes.
    implementation "dev.architectury:architectury-neoforge:${architectury_version}"
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    // Client-only CTM library, never referenced from our code
    runtimeOnly "earth.terrarium.athena:athena-neoforge-1.21:${athena_version}"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
